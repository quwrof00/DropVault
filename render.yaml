services:
  # The Backend WebSocket Server
  - type: web
    name: dropvault-collab
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      # Comma separated list of frontend origins allowed to call the API and to
      # open a collaboration WebSocket.
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://dropvault-web.vercel.app,http://localhost:5173

  # The Frontend Static Site
  - type: static
    name: dropvault-web
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Origin of the backend above. The API URL and the WebSocket URL are
      # derived from it, so this is the only backend setting the frontend needs.
      - key: VITE_BACKEND_URL
        sync: false # e.g. https://dropvault-collab.onrender.com
